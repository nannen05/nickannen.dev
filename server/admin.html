<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outreach admin</title><style>body{font:15px system-ui;max-width:1100px;margin:40px auto;padding:0 20px;color:#16202a}h1{margin-bottom:4px}.notice{background:#fff4d6;padding:12px;border-radius:6px}section{margin:28px 0}button{padding:8px 12px;cursor:pointer}textarea{width:100%;height:140px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}.stats{display:flex;gap:12px;flex-wrap:wrap}.card{border:1px solid #ddd;border-radius:8px;padding:14px;min-width:110px}.muted{color:#667}</style></head><body><h1>Outreach admin</h1><p class="notice"><strong>Sending is disabled by default.</strong> Review and approve contacts before enrolling them; campaigns must be explicitly activated server-side.</p><section><div class="stats" id="stats"></div></section><section><h2>Import Apollo CSV</h2><input id="file" type="file" accept=".csv,text/csv"> <button id="upload">Import</button><p id="import-result" class="muted"></p></section><section><h2>Campaigns</h2><table><thead><tr><th>Name</th><th>Status</th><th>Daily limit</th><th>Timezone</th><th>Dry run</th><th>Action</th></tr></thead><tbody id="campaigns"></tbody></table></section><section><h2>Recent leads</h2><table><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Score</th><th>Status</th></tr></thead><tbody id="leads"></tbody></table><p><a href="/api/admin/export/leads">Download master leads CSV</a></p></section><script>
const api=(url,options)=>fetch(url,options).then(async r=>{if(!r.ok)throw Error(await r.text());return r.json()});
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){const [stats,campaigns,leads]=await Promise.all([api('/api/admin/stats'),api('/api/admin/campaigns'),api('/api/admin/leads')]);document.querySelector('#stats').innerHTML=Object.entries(stats).map(([k,v])=>`<div class="card"><strong>${v}</strong><br><span class="muted">${k}</span></div>`).join('');document.querySelector('#campaigns').innerHTML=campaigns.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.status)}</td><td>${c.daily_limit}</td><td>${esc(c.timezone)}</td><td>${c.dry_run?'yes':'no'}</td><td><button onclick="toggle(${c.id},'${c.status==='active'?'paused':'active'}')">${c.status==='active'?'Pause':'Activate'}</button></td></tr>`).join('');document.querySelector('#leads').innerHTML=leads.map(l=>`<tr><td>${esc([l.first_name,l.last_name].join(' '))}</td><td>${esc(l.company)}</td><td>${esc(l.email)}</td><td>${l.score}</td><td>${esc(l.status)}</td></tr>`).join('')};
async function toggle(id,status){if(status==='active'&&!confirm('Activate this campaign? Live delivery still requires server configuration.'))return;await api('/api/admin/campaigns/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}window.toggle=toggle;
document.querySelector('#upload').onclick=async()=>{const file=document.querySelector('#file').files[0];if(!file)return;const result=await api('/api/admin/imports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,csv:await file.text()})});document.querySelector('#import-result').textContent=`Created ${result.created}; updated ${result.updated}.`;load()};load().catch(error=>alert(error.message));
</script></body></html>
