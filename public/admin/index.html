<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outreach admin</title><style>body{font:15px system-ui;max-width:1100px;margin:40px auto;padding:0 20px;color:#16202a}h1{margin-bottom:4px}.notice{background:#fff4d6;padding:12px;border-radius:6px}section{margin:28px 0}button{padding:8px 12px;cursor:pointer}textarea{width:100%;height:140px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}.stats{display:flex;gap:12px;flex-wrap:wrap}.card{border:1px solid #ddd;border-radius:8px;padding:14px;min-width:110px}.muted{color:#667}</style></head><body><h1>Outreach admin</h1><p class="notice"><strong>Sending is disabled by default.</strong> Review and approve contacts before enrolling them.</p><section><div class="stats" id="stats"></div></section><section><h2>Import Apollo CSV</h2><input id="file" type="file" accept=".csv,text/csv"> <button id="upload">Import</button><p id="import-result" class="muted"></p></section><section><h2>Campaigns</h2><table><thead><tr><th>Name</th><th>Status</th><th>Daily limit</th><th>Timezone</th><th>Dry run</th><th>Action</th></tr></thead><tbody id="campaigns"></tbody></table></section><section><h2>Recent leads</h2><button id="enroll">Enroll selected in DTC campaign</button><table><thead><tr><th></th><th>Name</th><th>Company</th><th>Email</th><th>Score</th><th>Status</th></tr></thead><tbody id="leads"></tbody></table><p><a href="/api/admin/export/leads">Download master leads CSV</a></p></section><script>const api=(u,o)=>fetch(u,o).then(async r=>{if(!r.ok)throw Error(await r.text());return r.json()});const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));let campaigns=[];async function load(){const[s,c,l]=await Promise.all([api('/api/admin/stats'),api('/api/admin/campaigns'),api('/api/admin/leads')]);campaigns=c;stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><strong>${v}</strong><br><span class="muted">${k}</span></div>`).join('');campaignsEl.innerHTML=c.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.status)}</td><td>${x.daily_limit}</td><td>${esc(x.timezone)}</td><td>${x.dry_run?'yes':'no'}</td><td><button onclick="toggle(${x.id},'${x.status==='active'?'paused':'active'}')">${x.status==='active'?'Pause':'Activate'}</button></td></tr>`).join('');leads.innerHTML=l.map(x=>`<tr><td><input type="checkbox" value="${x.id}"></td><td>${esc([x.first_name,x.last_name].join(' '))}</td><td>${esc(x.companies?.name)}</td><td>${esc(x.email)}</td><td>${x.score}</td><td>${esc(x.status)}</td></tr>`).join('')}const campaignsEl=document.querySelector('#campaigns');async function toggle(id,status){if(status==='active'&&!confirm('Activate this campaign?'))return;await api('/api/admin/campaigns',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});load()}window.toggle=toggle;upload.onclick=async()=>{const f=file.files[0];if(!f)return;const r=await api('/api/admin/imports',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:f.name,csv:await f.text()})});document.querySelector('#import-result').textContent=`Created ${r.created}; updated ${r.updated}.`;load()};enroll.onclick=async()=>{const ids=[...document.querySelectorAll('#leads input:checked')].map(x=>Number(x.value));const campaign=campaigns.find(x=>x.kind==='dtc');if(!ids.length||!campaign)return;const r=await api('/api/admin/enroll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({campaignId:campaign.id,contactIds:ids})});alert(`Enrolled ${r.enrolled}; skipped ${r.skipped.length}.`);load()};load().catch(e=>alert(e.message));</script></body></html>
